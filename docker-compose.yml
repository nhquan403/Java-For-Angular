# Chạy cả app và PostgreSQL:  docker compose up --build
# Cần file .env (copy từ .env.example) có JWT_SECRET, nếu thiếu docker compose sẽ báo lỗi ngay.
# API: http://localhost:8080/api/todos      Health: http://localhost:8080/actuator/health
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: tododb
      POSTGRES_USER: todo
      # Mật khẩu mặc định chỉ để chạy local. Muốn đổi: đặt POSTGRES_PASSWORD trong file .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo_local_only}
    ports:
      # Chỉ mở cho máy bạn, không mở ra mạng ngoài.
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d tododb"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Kafka một node, chế độ KRaft (không cần ZooKeeper). Chỉ dùng để học và chạy local.
  # Hai cổng nghe: kafka:19092 cho các container, localhost:9092 cho ứng dụng chạy trên máy bạn.
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/tododb
      DB_USER: todo
      DB_PASSWORD: ${POSTGRES_PASSWORD:-todo_local_only}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Cú pháp ":?" làm compose dừng và in thông báo nếu biến chưa được đặt.
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      JWT_SECRET: ${JWT_SECRET:?Hay dat JWT_SECRET trong file .env (xem .env.example)}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # Trợ lý AI: để trống thì tắt (endpoint /api/assistant/** trả 404).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8080:8080"

volumes:
  db-data:
