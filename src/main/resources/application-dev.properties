# Profile dev: chạy local, không cần cài database.
spring.datasource.url=jdbc:h2:mem:tododb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.show-sql=true
logging.level.com.example.todo=DEBUG

# Muốn thử Kafka ở dev: cần PostgreSQL thật (H2 không có advisory lock), nên chạy bằng docker compose
# (profile prod) thay vì bật ở đây. Dev mặc định giao sự kiện trong bộ nhớ, đủ để thử SSE và WebSocket.

# CHỈ DÙNG CHO DEV: khóa ký JWT và tài khoản admin mặc định ai cũng đọc được trong mã nguồn.
# Production phải dùng giá trị riêng qua biến môi trường (xem application-prod.properties).
app.security.jwt.secret=dev-only-secret-do-not-use-in-production-0123456789abcdef
app.security.bootstrap-admin.email=admin@example.com
app.security.bootstrap-admin.password=Admin#12345
