# Profile prod: mọi thông tin nhạy cảm lấy từ biến môi trường, không ghi cứng trong code.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false
logging.level.com.example.todo=INFO

# Domain frontend thật, ví dụ CORS_ALLOWED_ORIGINS=https://app.example.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Khóa ký JWT, BẮT BUỘC có và tối thiểu 32 ký tự. Không có giá trị mặc định nên thiếu là app không khởi động.
# Tạo khóa: openssl rand -base64 48
app.security.jwt.secret=${JWT_SECRET}

# Tài khoản ADMIN đầu tiên (không bắt buộc). Chỉ tạo nếu email đó chưa tồn tại.
# Nên đặt biến này cho lần chạy đầu, tạo xong thì xóa mật khẩu khỏi môi trường.
app.security.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Kafka bật ở production: nhiều instance cùng nhận sự kiện qua broker.
# Chạy một instance và chưa có broker thì đặt KAFKA_ENABLED=false (sự kiện giao trong bộ nhớ).
app.kafka.enabled=${KAFKA_ENABLED:true}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Không công khai tài liệu API trên production.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
