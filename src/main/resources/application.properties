spring.application.name=todo-api

# Profile mặc định là dev. Production chạy với SPRING_PROFILES_ACTIVE=prod
# (xem application-dev.properties và application-prod.properties).
spring.profiles.default=dev

# Bảng do Flyway tạo (db/migration), Hibernate chỉ kiểm tra entity khớp bảng.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# CORS: các domain frontend được phép gọi API, cách nhau bằng dấu phẩy.
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# JWT. Khóa bí mật (app.security.jwt.secret) đặt riêng ở từng profile, KHÔNG đặt ở file chung này.
app.security.jwt.issuer=todo-api
# Access token sống ngắn: bị lộ cũng chỉ dùng được trong thời gian này.
app.security.jwt.access-token-ttl=15m
# Refresh token sống lâu hơn. Mỗi lần dùng sẽ bị thu hồi và phát token mới (xoay vòng).
app.security.jwt.refresh-token-ttl=7d
# Độ chậm của BCrypt (mỗi +1 chậm gấp đôi). 10 là mức phổ biến, tăng dần theo sức máy chủ.
app.security.bcrypt-strength=10

# Thời gian thực (SSE + WebSocket). Xem RealtimeProperties.
app.realtime.max-connections-per-user=5
# Client chậm đến mức hàng đợi này đầy thì bị ngắt (rồi tự kết nối lại).
app.realtime.queue-capacity=256
app.realtime.heartbeat-interval=25s
# Bằng hạn access token: kết nối không sống lâu hơn quyền của người dùng.
app.realtime.max-connection-age=15m
app.realtime.ticket-ttl=30s

# Kafka. TẮT mặc định để chạy dev không cần broker: sự kiện được giao thẳng trong bộ nhớ (một instance).
# Bật (true) thì sự kiện đi qua outbox -> Kafka -> mọi instance. Chế độ bật yêu cầu PostgreSQL.
app.kafka.enabled=false
app.kafka.topic=todo-events
app.kafka.partitions=3
app.kafka.replicas=1
app.kafka.consumer-group-prefix=todo-api-realtime
app.kafka.outbox.poll-interval-ms=200
app.kafka.outbox.batch-size=200
app.kafka.outbox.send-timeout-ms=10000
app.kafka.outbox.retention=1d
spring.kafka.bootstrap-servers=localhost:9092
# acks=all + idempotence: không mất và không gửi trùng khi gửi lại do lỗi mạng tạm thời.
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.compression-type=lz4
spring.kafka.producer.properties.enable.idempotence=true
# Đợi tối đa 5ms để gộp nhiều bản ghi vào một request, giảm số lần gọi mạng.
spring.kafka.producer.properties.linger.ms=5
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Client mới kết nối không cần sự kiện cũ.
spring.kafka.consumer.auto-offset-reset=latest

# Trợ lý AI (POST /api/assistant/chat). Chỉ bật khi có biến môi trường ANTHROPIC_API_KEY;
# API key KHÔNG được ghi vào file này. Đặt false để tắt hẳn kể cả khi có key (endpoint trả 404).
app.assistant.enabled=true
app.assistant.model=claude-opus-5-5
# Token tối đa của một vòng trả lời (gồm cả phần suy nghĩ của model).
app.assistant.max-tokens=16000
# Số câu hỏi tối đa của một người trong một phút, vượt thì 429.
app.assistant.rate-limit-per-minute=20
# Thời gian chờ một lần gọi Claude, và thời gian tối đa của cả một câu trả lời.
app.assistant.request-timeout=60s
app.assistant.stream-timeout=5m

# Actuator: chỉ mở health và info. Probe cho Kubernetes: /actuator/health/liveness và /readiness.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Mỗi dòng log mang request id (xem CorrelationIdFilter).
logging.pattern.level=%5p [%X{requestId:-}]

# Tắt app êm: chờ request đang chạy xong tối đa 20 giây.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
